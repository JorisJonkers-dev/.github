# Advisory hygiene sweep over every open pull request in the organization,
# scheduled, from a public repository.
#
# Why here: Actions minutes are billed to the caller, never to the repo
# holding the reusable workflow. The blocking guard runs in the repo being
# checked, so each private repo firing it pays for the run -- ~292 minutes a
# month across fleet-infra and nix-config for a job averaging 6.6 seconds.
# Standard runners are free in public repositories, and this repo is public.
#
# This does NOT replace repository-hygiene-guard.yml. Since github-workflows
# v0.46.0, 'repository-hygiene / Agent Attribution Guard' is a required status
# check in most repositories, beside 'Pipeline Complete', so the per-PR guard
# blocks merges; this sweep only reports. retrigger-missing-checks.yml reopens
# pull requests whose required checks never reported.
name: 'Org Hygiene Sweep'

'on':
  schedule:
    # Every 6 hours. Advisory, so there is nothing to gain from reacting
    # within minutes; a red sweep and a sticky PR comment are the signal.
    - cron: '25 */6 * * *'
  workflow_dispatch:
    inputs:
      comment:
        description: 'Post sticky comments on offending pull requests.'
        required: false
        type: boolean
        default: true

permissions:
  contents: 'read'

concurrency:
  group: 'org-hygiene-sweep'
  cancel-in-progress: false

jobs:
  sweep:
    uses: 'JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-sweep.yml@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1 # main
    with:
      # No exclusions: fleet-infra and nix-config dropped their per-PR guards,
      # so the sweep is now their only hygiene coverage. Anything listed here
      # is a repo the sweep does not look at -- only exclude one that still
      # runs the per-PR workflow, or it silently goes unchecked.
      comment: "${{ inputs.comment == null && true || inputs.comment }}"
    secrets:
      HYGIENE_APP_ID: '${{ secrets.RELEASE_APP_ID }}'
      HYGIENE_APP_PRIVATE_KEY: '${{ secrets.RELEASE_APP_PRIVATE_KEY }}'
